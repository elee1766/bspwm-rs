[package]
name = "bspwm-x11"
version = "0.9.12"
edition = "2024"
license = "BSD-2-Clause"
description = "X11 protocol and platform support for bspwm-rs"

[dependencies]
bspwm-core = { version = "0.9.12", path = "../bspwm-core" }
bspwm-model = { version = "0.9.12", path = "../bspwm-model" }
bspwm-xstack = { version = "0.1.0", path = "../bspwm-xstack" }
thiserror = "2"
xcb = { version = "1.7.0", features = ["randr", "shape", "sync", "xinerama"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
