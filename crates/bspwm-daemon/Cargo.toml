[package]
name = "bspwm-daemon"
version = "0.9.12"
edition = "2024"
license = "BSD-2-Clause"
description = "Daemon, command, runtime, and X11 logic for bspwm-rs"

[lib]
name = "bspwm"

[dependencies]
bspwm-client = { version = "0.9.12", path = "../bspwm-client" }
bspwm-core = { version = "0.9.12", path = "../bspwm-core" }
bspwm-model = { version = "0.9.12", path = "../bspwm-model" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
xcb = { version = "1.7.0", features = ["randr", "shape", "sync", "xinerama"] }
nix = { version = "0.30", features = ["fs", "poll", "process", "signal", "socket"] }
mio = { version = "1", features = ["os-poll", "os-ext"] }
listenfd = "1.0.2"
signal-hook = "0.4.4"
log = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
